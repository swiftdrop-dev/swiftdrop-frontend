name: SwiftDrop Frontend CI

on:
  push:
    branches: [ main, dev, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Typecheck and Build Production Bundle
        run: npm run build
